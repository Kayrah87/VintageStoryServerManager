name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: [self-hosted, galaxy]
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
      volumes:
        - /var/cache/vintagestoryservermanager-ci/nuget:/root/.nuget/packages
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Restore
        run: dotnet restore VintageStoryServerManager.slnx
      - name: Build
        run: dotnet build VintageStoryServerManager.slnx -c Release --no-restore
      - name: Test
        run: dotnet test VintageStoryServerManager.slnx -c Release --no-build
