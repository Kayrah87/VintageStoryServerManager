name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub-hosted runners: this repo is public, so fork PRs must never reach
# the self-hosted galaxy runners.
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore VintageStoryServerManager.slnx
      - name: Build
        run: dotnet build VintageStoryServerManager.slnx -c Release --no-restore
      - name: Test
        run: dotnet test VintageStoryServerManager.slnx -c Release --no-build

  # Publishes ghcr.io/<owner>/vintagestoryservermanager after tests pass on main or a v* tag.
  image:
    needs: build-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Read bundled game version
        id: vs
        run: echo "version=$(grep -m1 '^ARG VS_VERSION=' Dockerfile | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vintagestoryservermanager
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=vs-${{ steps.vs.outputs.version }},enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
