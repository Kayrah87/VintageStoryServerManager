name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# GitHub-hosted runners: this repo is public, so fork PRs must never reach
# the self-hosted galaxy runners.
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"
      - name: Restore
        run: dotnet restore VintageStoryServerManager.slnx
      - name: Build
        run: dotnet build VintageStoryServerManager.slnx -c Release --no-restore
      - name: Test
        run: dotnet test VintageStoryServerManager.slnx -c Release --no-build
