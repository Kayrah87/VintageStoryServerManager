services:
  vintagestory:
    build:
      context: .
      args:
        VS_VERSION: "1.22.7"
    image: ghcr.io/kayrah87/vintagestoryservermanager:latest
    container_name: vintagestory
    restart: unless-stopped
    # Time for the game server to save the world and stop cleanly on `docker compose down`.
    stop_grace_period: 2m
    ports:
      - "80:8080"          # management web UI
      - "42420:42420/tcp"  # game server
      - "42420:42420/udp"
    environment:
      # Run as this host user so the files in ./data belong to it (default 1654).
      # PUID: "1000"
      # PGID: "1000"
      # First admin account (only used when there are no users yet).
      # Leave the password unset to have one generated and printed to the log.
      Admin__Username: admin
      # Admin__Password: change-me
    volumes:
      # Worlds, mods, server config, manager database and backups.
      # Mount the same folder into another container to move the server.
      - ./data:/data
